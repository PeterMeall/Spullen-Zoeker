<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#A0441F">
  <title>Spullenzoeker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><h1 id="title">Spullenzoeker</h1><span id="syncbadge" class="badge"></span></header>
  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-act="tab" data-tab="home"><span>🏠</span>Home</button>
    <button data-act="tab" data-tab="items"><span>📦</span>Items</button>
    <button data-act="tab" data-tab="locations"><span>📍</span>Locaties</button>
    <button data-act="tab" data-tab="settings"><span>⚙️</span>Instellingen</button>
  </nav>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="login" class="modal hidden"><div class="sheet" id="loginsheet"></div></div>
  <div id="welcome" class="modal hidden"><div class="sheet" id="welcomesheet"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
